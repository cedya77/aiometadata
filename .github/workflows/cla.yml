name: CLA

# Every pull request author, and every co-author named in its commits, signs
# docs/CLA.md once by commenting the sign-off sentence. Signatures are stored
# in this repository on the cla-signatures branch. A pull request cannot merge
# until this check passes (make it a required check in branch protection).

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the AIOMetadata Contributor License Agreement and I hereby sign it.') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/${{ github.repository }}/blob/dev/docs/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'cedya77,dependabot[bot],github-actions[bot],release-please[bot]'
          custom-pr-sign-comment: 'I have read the AIOMetadata Contributor License Agreement and I hereby sign it.'
          custom-allsigned-prcomment: 'Every contributor on this pull request has signed the CLA.'
          lock-pullrequest-aftermerge: false
