name: Docker - Build and Push Release Image

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version to build, without the leading v.'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, such as 2.13.0. Leave empty to build the newest release.'
        required: false
        type: string
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # Resolves the version to build and the parts the image tags are made of.
      # `latest` is only granted to the newest release, so rebuilding an older
      # version by hand never moves it backwards.
      - name: Resolve version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          newest_tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
          newest="${newest_tag#v}"

          requested="$REQUESTED_VERSION"
          if [ -z "$requested" ]; then
            if [ -z "$newest" ]; then
              echo "::error title=Version::No version was given and no GitHub release was found to fall back on."
              exit 1
            fi
            requested="$newest_tag"
          fi

          version="${requested#v}"
          if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error title=Version::'$requested' is not a release version; expected X.Y.Z such as 2.13.0 (a leading v is allowed)."
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"

          if [ -n "$newest" ] && [ "$version" = "$newest" ]; then
            is_latest=true
          else
            is_latest=false
          fi

          echo "Building $version (newest release: ${newest:-none}, latest tag: $is_latest)"
          {
            echo "version=$version"
            echo "major=$major"
            echo "minor=$minor"
            echo "is_latest=$is_latest"
          } >> "$GITHUB_OUTPUT"

      # The tag, not the branch: a dispatch runs from dev, whose HEAD is not the release.
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: v${{ steps.version.outputs.version }}

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3
        with:
          image: mirror.gcr.io/tonistiigi/binfmt:latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.major }}.${{ steps.version.outputs.minor }}
            type=raw,value=${{ steps.version.outputs.major }}
            type=raw,value=latest,enable=${{ steps.version.outputs.is_latest }}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
